# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/pure-python
[build-system]
requires = [
    "setuptools >= 78.1.1,< 81",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "grokcore.view"
version = "5.1"
description = "Grok-like configuration for Zope browser pages"
license = "ZPL-2.1"
classifiers = [
    "Development Status :: 6 - Mature",
    "Environment :: Web Environment",
    "Framework :: Zope :: 3",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["readme"]
requires-python = ">=3.10"
authors = [
    {name = "Grok Team",email = "zope-dev@zope.dev"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "zope-dev@zope.dev"},
]
dependencies = [
    "grokcore.component >= 2.5",
    "grokcore.security",
    "martian >= 1.5",
    "zope.browserpage",
    "zope.browserresource >= 3.9",
    "zope.component",
    "zope.contentprovider",
    "zope.interface",
    "zope.pagetemplate",
    "zope.ptresource >= 3.9",
    "zope.publisher",
    "zope.security",
    "zope.traversing",
]

[project.optional-dependencies]
test = [
    "zope.app.appsetup",
    "zope.app.publication",
    "zope.app.wsgi[test]",
    "zope.configuration",
    "zope.container",
    "zope.login",
    "zope.password",
    "zope.principalregistry",
    "zope.securitypolicy",
    "zope.site",
    "zope.testbrowser",
    "zope.testing",
]
security_publication = ["zope.app.publication"]

[project.urls]
Source = "https://github.com/zopefoundation/grokcore.view"
Issues = "https://github.com/zopefoundation/grokcore.view/issues"
Changelog = "https://raw.githubusercontent.com/zopefoundation/grokcore.view/master/CHANGES.rst"

[tool.coverage.run]
branch = true
source = ["grokcore.view"]

[tool.coverage.report]
fail_under = 93
precision = 2
ignore_errors = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "self.fail",
    "raise AssertionError",
    "raise unittest.Skip",
]

[tool.coverage.html]
directory = "parts/htmlcov"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}

